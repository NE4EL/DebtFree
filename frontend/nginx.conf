server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS Docker: адрес backend определяется при каждом запросе,
    # поэтому перезапуск контейнера backend не ломает прокси
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI (если DOCS_ENABLED=true)
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки Vite содержат хеш в имени — их можно кешировать надолго
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаёт index.html, маршрутизацией занимается React
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
